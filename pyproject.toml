[project]
name = "microsd-utils"
version = "0.1.0"
description = "Tools for checking, backing up and copying microSD cards on macOS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
microsd = "microsd_utils.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microsd_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["manual: needs the real card in the designated reader; run with -m manual"]
addopts = "-m 'not manual'"
